name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Create Basic Project
        run: |
          flutter create --org com.doctorai temporary_project
          cp main.dart temporary_project/lib/main.dart
          cd temporary_project
          flutter build apk --release
          mv build/app/outputs/flutter-apk/app-release.apk ../doctor-ai.apk
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: doctor-ai-app
          path: doctor-ai.apk
          
