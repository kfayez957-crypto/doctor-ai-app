name: Build Flutter APK From Mobile

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.0'
        channel: 'stable'

    - name: Initialize Flutter Structure
      run: |
        # গিটহাব ব্যাকএন্ডে একটি ডেমো প্রোজেক্ট তৈরি করবে
        flutter create --org com.example temporary_project --empty
        
        # আপনার তৈরি করা main.dart ফাইলটিকে সঠিক জায়গায় প্রতিস্থাপন করবে
        cp main.dart temporary_project/lib/main.dart
        
        # মূল ডিরেক্টরিতে প্রজেক্টটি সেট করবে
        cd temporary_project
        flutter pub get
        
    - name: Build APK
      run: |
        cd temporary_project
        flutter build apk --debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: doctor-ai-apk
        path: temporary_project/build/app/outputs/flutter-apk/app-debug.apk
        
